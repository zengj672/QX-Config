[general]
; 资源解析器，用于将不同格式的重写链接转换为圈X可用的格式
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
server_check_url = http://cp.cloudflare.com/generate_204

[dns]
; 禁用系统 DNS 与 IPv6，确保万兆环境下的纯净解析
no-system
no-ipv6
prefer-doh3

; 过滤无效解析结果
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0, 240.0.0.0
circumvent-ipv6-answer = ::

; DNS 启动锚点：解决 DoH 服务器域名的解析问题
address = /doh.pub/223.5.5.5
address = /sr6axa6hjo.cloudflare-gateway.com/162.159.36.1

; 加密 DNS 模块
doh-server = https://sr6axa6hjo.cloudflare-gateway.com/dns-query

; 基础 DNS 服务器
server = 223.5.5.5
server = 119.29.29.29

; 国内加速解析（不加 filter 确保实测稳定性）
server = /*.cn/223.5.5.5
server = /*.apple.com/223.5.5.5
server = /*.alipay.com/223.5.5.5
server = /*.taobao.com/223.5.5.5

; 本地/局域网解析使用系统默认
server = /*.local/system
server = /*.lan/system

[policy]
; --- 策略组：请将 proxy 替换为你真实的节点名 ---
static=Proxy, proxy, direct, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Global.png
static=Apple, direct, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Apple.png
static=Google, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Google.png
static=YouTube, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/YouTube.png
static=Gemini, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Google_Al.png
static=Telegram, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Telegram.png
static=GitHub, Proxy, direct, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/GitHub.png
static=Twitter, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Twitter.png
static=Spotify, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Spotify.png
static=ChatGPT, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/ChatGPT.png
static=Claude, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Claude.png
static=Instagram, Proxy, img-url=https://raw.githubusercontent.com/Kuloud/Icon/master/Instagram.png

[filter_remote]
; 这里可以添加你习惯使用的其他远程分流订阅

[filter_local]
; --- 1. 局域网直连 (最高优先级) ---
ip-cidr, 10.0.0.0/8, direct, no-resolve
ip-cidr, 127.0.0.0/8, direct, no-resolve
ip-cidr, 172.16.0.0/12, direct, no-resolve
ip-cidr, 192.168.0.0/16, direct, no-resolve
ip-cidr, 224.0.0.0/24, direct, no-resolve

; --- 2. 精准分流规则 ---
